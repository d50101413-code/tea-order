<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>茶日子｜線上點餐</title>
  <style>
    :root{--ink:#24382e;--muted:#78847b;--green:#365b47;--leaf:#e8efe6;--cream:#f7f5ef;--paper:#fffefa;--line:#e8e8df;--orange:#d88153;--shadow:0 12px 36px #263a2a0d}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
    button,input{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:28px 26px 56px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.04em}.brand-mark{width:42px;height:42px;border-radius:15px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}.header-note{color:var(--muted);font-size:13px}
    .hero{position:relative;overflow:hidden;border-radius:26px;background:#e8eee4;padding:36px 40px;margin-bottom:25px;min-height:180px}.hero:after{content:"🍃";position:absolute;font-size:112px;right:7%;top:14px;opacity:.68;transform:rotate(-19deg)}.eyebrow{color:var(--green);font-weight:750;font-size:12px;letter-spacing:.16em}.hero h1{font-size:34px;line-height:1.25;margin:10px 0 8px;letter-spacing:.02em}.hero p{margin:0;color:#647368;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:22px;align-items:start}.panel{background:var(--paper);border:1px solid #eeeee7;border-radius:22px;padding:25px;box-shadow:var(--shadow)}.section-title{font-size:18px;font-weight:800;margin:0 0 4px}.section-hint{font-size:13px;color:var(--muted);margin:0 0 20px}.field{margin-top:22px}.field-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.field-label{font-weight:750;font-size:14px}.required{font-size:11px;color:var(--orange);font-weight:700}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{min-height:47px;border:1px solid var(--line);background:white;border-radius:13px;padding:12px 10px;display:flex;justify-content:center;align-items:center;text-align:center;font-size:14px;color:#526158;transition:.16s;cursor:pointer}.choice input:checked+label{border-color:var(--green);background:var(--leaf);color:var(--green);box-shadow:inset 0 0 0 1px var(--green);font-weight:750}.choice input:focus-visible+label{outline:3px solid #9db9a2}.toppings{grid-template-columns:repeat(3,minmax(0,1fr))}.toppings label{gap:6px}.toppings input:checked+label:before{content:"✓";font-weight:900}.quantity-row{display:flex;align-items:center;justify-content:space-between}.stepper{display:flex;align-items:center;gap:15px}.stepper button{width:34px;height:34px;border:1px solid var(--line);background:white;border-radius:11px;color:var(--green);font-size:19px}.stepper output{min-width:18px;text-align:center;font-weight:750}.add-button{width:100%;margin-top:24px;border:0;border-radius:14px;background:var(--green);color:white;padding:15px;font-weight:800;transition:.18s}.add-button:hover{background:#294937;transform:translateY(-1px)}.cart-panel{position:sticky;top:18px}.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.count{background:var(--leaf);color:var(--green);font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px}.empty{padding:30px 14px;text-align:center;background:#f8f8f3;border-radius:15px;color:var(--muted);font-size:14px}.empty-icon{font-size:29px;margin-bottom:7px}.cart-list{display:grid;gap:10px}.cart-item{border:1px solid var(--line);border-radius:15px;padding:13px 14px}.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.item-name{font-weight:800}.remove{border:0;background:transparent;color:#9a8176;font-size:12px;padding:4px}.item-detail{font-size:12px;color:var(--muted);line-height:1.65;margin-top:6px}.item-qty{font-size:12px;color:var(--green);font-weight:750;margin-top:6px}.cart-footer{border-top:1px solid var(--line);margin-top:17px;padding-top:15px}.cup-total{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:13px}.checkout{width:100%;border:0;border-radius:13px;background:var(--orange);color:white;padding:14px;font-weight:800}.checkout:disabled{background:#d8d8cf;cursor:not-allowed}.clear{display:block;margin:11px auto 0;border:0;background:none;color:var(--muted);font-size:12px;padding:5px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;background:#263d30;color:white;padding:12px 18px;border-radius:12px;font-size:14px;transition:.2s;pointer-events:none;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}footer{text-align:center;color:#98a098;font-size:12px;margin-top:25px}
    .person-input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;color:var(--ink);outline:none}.person-input:focus{border-color:var(--green);box-shadow:0 0 0 3px #365b4718}.field-note{margin-top:7px;color:var(--muted);font-size:12px}.summary-block{margin-top:17px}.summary-title{font-size:13px;font-weight:800;margin-bottom:8px}.summary-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #f0f0ea;padding:8px 2px;font-size:12px}.summary-row span:last-child{font-weight:750;color:var(--green);white-space:nowrap}.done-button{width:100%;margin-top:10px;border:1px solid #d8e4d8;background:var(--leaf);color:var(--green);border-radius:12px;padding:11px;font-weight:750}.done-button.done{background:#f5f3ed;color:#7a8079;border-color:var(--line)}.staff-progress{margin-top:14px;border:1px solid var(--line);border-radius:13px;padding:10px 12px}.staff-progress summary{font-size:13px;font-weight:750;color:var(--green);cursor:pointer}.staff-list{display:grid;gap:5px;max-height:260px;overflow:auto;margin-top:10px}.staff-row{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid #f1f1eb;background:transparent;padding:6px 2px;text-align:left;font-size:12px;cursor:pointer}.staff-state{color:var(--muted)}.staff-state.pending{color:#a17d42}.staff-state.finished{color:var(--green);font-weight:750}
    .deadline-note{display:inline-block;margin-top:14px;border-radius:20px;background:#fffefa9c;color:var(--green);padding:8px 13px;font-size:13px;font-weight:700}.deadline-note.closed{background:#f7e6dc;color:#944c35}.add-button:disabled{background:#aeb7ae;cursor:not-allowed;transform:none}
    @media(max-width:760px){.shell{padding:18px 15px 35px}.header-note{display:none}.hero{padding:27px 24px;min-height:160px}.hero:after{right:-4%;top:40px;font-size:76px;opacity:.45}.hero h1{font-size:28px;max-width:70%}.layout{grid-template-columns:1fr}.panel{padding:21px}.cart-panel{position:static}.choices{gap:7px}.choice label{font-size:13px;padding:10px 5px}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><span class="brand-mark">茶</span><span>茶日子</span></div><div class="header-note">一杯剛剛好的日常 ☀️</div></header>
    <section class="hero"><div class="eyebrow">TEA TIME, ANYTIME</div><h1>今天想喝點什麼？</h1><p>挑一款茶，調成你喜歡的樣子。</p><div class="deadline-note" id="deadlineNote" role="status"></div></section>
    <main class="layout">
      <section class="panel" aria-labelledby="order-title">
        <h2 class="section-title" id="order-title">病房會議點餐</h2><p class="section-hint">先選點餐人員，再為每位人員加入飲料。</p>
        <div class="field" style="margin-top:16px"><div class="field-top"><label class="field-label" for="person">輸入點餐人員姓名</label><span class="required">必填</span></div><input class="person-input" id="person" list="staffList" placeholder="打字搜尋姓名" autocomplete="off"><datalist id="staffList"></datalist><div class="field-note" id="personNote">名單來源：病房會議名單115.09.22；人數依名單更新</div><button class="clear" id="downloadRoster" type="button">下載會議人員名單</button></div>
        <div class="field"><div class="field-top"><span class="field-label">選擇飲料</span><span class="required">必選</span></div><div class="choices" id="drinkChoices"></div></div>
        <div class="field"><div class="field-top"><span class="field-label">甜度</span><span class="required">必選</span></div><div class="choices" id="sugarChoices"></div></div>
        <div class="field"><div class="field-top"><span class="field-label">冰度</span><span class="required">必選</span></div><div class="choices" id="iceChoices"></div></div>
        <div class="field"><div class="field-top"><span class="field-label">加料</span><span class="required">可複選</span></div><div class="choices toppings" id="toppingChoices"></div></div>
        <div class="field field-note">每人限點一杯飲料</div>
        <button class="add-button" type="button" id="addButton">＋ 加入我的一杯飲料</button>
      </section>
      <aside class="panel cart-panel" aria-labelledby="cart-title"><div class="cart-head"><h2 class="section-title" id="cart-title">點餐統整</h2><span class="count" id="itemCount">0 杯</span></div><div class="field-note" id="progress">載入人員點餐進度…</div><details class="staff-progress"><summary>查看每位人員點餐狀態</summary><div class="staff-list" id="staffStatusList"></div></details><div id="cartContent"></div><div id="summaryContent"></div><button class="done-button" id="doneButton" type="button">完成此人點餐</button><div class="cart-footer"><div class="cup-total"><span>飲料總數</span><strong id="totalCups">0 杯</strong></div><button class="checkout" id="checkout" disabled>下載點餐統整 CSV</button><button class="clear" id="clearButton">清空清單</button></div></aside>
    </main>
    <footer>茶日子・把喜歡的茶，喝成日常</footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const options={drink:['紅茶','綠茶','烏龍茶'],sugar:['無糖','一分糖','微糖','半糖','八分糖','全糖'],ice:['去冰','微冰','正常冰','少冰'],topping:['珍珠','波霸','椰果']};
    const staff=['王美珍','王詩萍','陳誼華','李雅嵐','孫宜鈴','簡筱燕','陳可欣','金美棋','黃瓊慧','林欣瑩','林佳俐','王美娟','周昱伶','賴怡儒','洪婉瑜','陳婉婷','王玫方','吳姿穎','劉怡芳','李宛俞','陳俐妏','謝靜儀','周俞伶','林奕萍','蔡孟秀','林旻嬑','楊絲媛','陳靜慧','潘柏諭','楊香君','王瑞菱','吳珍宜','陳秀婷','曾嘉琳','陳品辰','郭于涵','戴宇宣','盧文萍','林玟雯','陳念慈','吳昔珍','陳玉倩','翁千惠','艾怡靈','凃宛伶','龍薏因','林珮穎','鄭乃妏','蘇琬貞','王瓊穗','黃臺英','郭貞儀','陳美玟','謝亞淨','吳珮綾','林佩君','方婷俞','魏羽辛','李繐菁','張聿彣','林惠敏','郭桂瑛','曾士豪','方姿淳','李沛錞','謝宛芯','許瓊云','何淑娟','張鳳庭','蕭依芳','蘇美惠','簡慶雲','陳羿伶','劉紋伶'];
    const cart=[];const done=new Set();const orderDeadline=new Date('2026-10-23T14:02:39+08:00');let deadlineTimer;
    document.getElementById('staffList').innerHTML=staff.map(name=>`<option value="${name}">`).join('');
    function renderChoices(id,items,name,type){document.getElementById(id).innerHTML=items.map((item,i)=>`<div class="choice"><input type="${type}" name="${name}" id="${name}-${i}" value="${item}" ${type==='radio'&&i===0?'checked':''}><label for="${name}-${i}">${item}</label></div>`).join('')}
    renderChoices('drinkChoices',options.drink,'drink','radio');renderChoices('sugarChoices',options.sugar,'sugar','radio');renderChoices('iceChoices',options.ice,'ice','radio');renderChoices('toppingChoices',options.topping,'topping','checkbox');
    const getSelected=name=>document.querySelector(`input[name="${name}"]:checked`)?.value;
    const personInput=document.getElementById('person');const selectedPerson=()=>staff.includes(personInput.value.trim())?personInput.value.trim():'';
    document.getElementById('addButton').onclick=()=>{if(Date.now()>=orderDeadline){updateOrderingWindow();showToast('點餐時間已截止');return}const person=selectedPerson();if(!person){personInput.focus();showToast('請輸入名單中的姓名');return}if(cart.some(x=>x.person===person)){showToast(`${person}已點過一杯，如需更改請先移除原訂單`);return}const item={person,drink:getSelected('drink'),sugar:getSelected('sugar'),ice:getSelected('ice'),toppings:[...document.querySelectorAll('input[name="topping"]:checked')].map(x=>x.value),qty:1};cart.push(item);done.delete(person);document.querySelectorAll('input[name="topping"]').forEach(x=>x.checked=false);renderCart();showToast(`${person}的一杯飲料已加入`);};
    function renderCart(){const cups=cart.reduce((sum,x)=>sum+x.qty,0);document.getElementById('progress').textContent=`已完成 ${done.size} / ${staff.length} 位`;document.getElementById('itemCount').textContent=`${cups} 杯`;document.getElementById('totalCups').textContent=`${cups} 杯`;document.getElementById('checkout').disabled=!cups;const statusList=document.getElementById('staffStatusList');statusList.innerHTML=staff.map(name=>{const hasOrder=cart.some(x=>x.person===name);const isDone=done.has(name);const state=isDone?'已完成':hasOrder?'點餐中':'尚未點餐';const css=isDone?'finished':hasOrder?'pending':'';return `<button type="button" class="staff-row" data-staff="${name}"><span>${name}</span><span class="staff-state ${css}">${state}</span></button>`}).join('');statusList.querySelectorAll('[data-staff]').forEach(b=>b.onclick=()=>{personInput.value=b.dataset.staff;renderCart()});const content=document.getElementById('cartContent');if(!cart.length){content.innerHTML='<div class="empty"><div class="empty-icon">🥤</div>清單還是空的<br>先選一位同仁開始點餐吧！</div>';document.getElementById('summaryContent').innerHTML='';document.getElementById('doneButton').style.display='none';return}document.getElementById('doneButton').style.display='block';const people=[...new Set(cart.map(x=>x.person))];content.innerHTML=`<div class="summary-block"><div class="summary-title">個人訂單</div>${people.map(person=>{const items=cart.filter(x=>x.person===person);const n=items.reduce((s,x)=>s+x.qty,0);return `<div class="summary-row"><span>${person}${done.has(person)?' ✓':''}</span><span>${n} 杯</span></div>${items.map(x=>`<div class="item-detail" style="padding:2px 2px 5px">${x.drink}・${x.sugar}・${x.ice}・${x.toppings.length?x.toppings.join('、'):'不加料'} × ${x.qty}</div>`).join('')}`}).join('')}</div>`;const combos=new Map();cart.forEach(x=>{const key=[x.drink,x.sugar,x.ice,x.toppings.join('、')].join('|');combos.set(key,(combos.get(key)||0)+x.qty)});document.getElementById('summaryContent').innerHTML=`<div class="summary-block"><div class="summary-title">飲料彙總</div>${[...combos.entries()].map(([key,n])=>`<div class="summary-row"><span>${key.replaceAll('|','・')}</span><span>${n} 杯</span></div>`).join('')}</div>`;const p=selectedPerson();const doneButton=document.getElementById('doneButton');doneButton.disabled=!p||!cart.some(x=>x.person===p);doneButton.classList.toggle('done',!!p&&done.has(p));doneButton.textContent=p&&done.has(p)?`${p} 已完成（點此重新開啟）`:'完成此人點餐';content.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const removed=cart.splice(Number(b.dataset.remove),1)[0];if(removed)done.delete(removed.person);renderCart()})}
    let toastTimer;function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function updateOrderingWindow(){const remaining=orderDeadline-Date.now(),form=document.querySelector('[aria-labelledby="order-title"]'),note=document.getElementById('deadlineNote');if(remaining<=0){note.textContent='點餐已截止；已收訂單仍可查看及下載。';note.classList.add('closed');form.querySelectorAll('.choice input').forEach(el=>el.disabled=true);personInput.disabled=true;document.getElementById('addButton').disabled=true;clearInterval(deadlineTimer);return}const totalSeconds=Math.floor(remaining/1000),days=Math.floor(totalSeconds/86400),hours=Math.floor(totalSeconds%86400/3600),minutes=Math.floor(totalSeconds%3600/60),seconds=totalSeconds%60;note.textContent=`開放點餐至 2026/10/23 14:02:39（剩 ${days} 天 ${hours} 小時 ${minutes} 分 ${seconds} 秒）`}
    personInput.addEventListener('input',renderCart);
    document.getElementById('doneButton').onclick=()=>{const p=selectedPerson();if(!p)return;if(done.has(p))done.delete(p);else done.add(p);renderCart();showToast(done.has(p)?`${p}已完成點餐`:`已重新開啟${p}的點餐`)};
    document.getElementById('clearButton').onclick=()=>{if(!cart.length)return;cart.length=0;done.clear();renderCart();showToast('已清空點餐清單')};
    document.getElementById('downloadRoster').onclick=()=>{const csv='\uFEFF'+['點餐人員',...staff].map(name=>`"${name}"`).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='病房會議名單115.09.22.csv';a.click();URL.revokeObjectURL(url);showToast(`已下載 ${staff.length} 位會議人員名單`)};
    document.getElementById('checkout').onclick=()=>{if(!cart.length)return;const rows=[['點餐人員','飲料','甜度','冰度','加料','數量']];cart.forEach(x=>rows.push([x.person,x.drink,x.sugar,x.ice,x.toppings.length?x.toppings.join('、'):'不加料',x.qty]));const csv='\uFEFF'+rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='病房會議點餐統整.csv';a.click();URL.revokeObjectURL(url);showToast('已下載個人訂單明細')};
    renderCart();deadlineTimer=setInterval(updateOrderingWindow,1000);updateOrderingWindow();
  </script>
</body>
</html>
